# Chạy toàn bộ hệ thống trên một máy: docker compose up --build
# Mở http://localhost:8080  (tổ chức: htm · admin@htm.local · mật khẩu = SEED_PASSWORD)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: htm
      POSTGRES_PASSWORD: htm_dev
      POSTGRES_DB: htm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htm -d htm"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://htm:htm_dev@postgres:5432/htm
      SEED_PASSWORD: ${SEED_PASSWORD:-Doi-Mat-Khau-Ngay}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://htm_app:htm_app_dev@postgres:5432/htm
      JWT_SECRET: ${JWT_SECRET:-local-only-secret-change-me-0123456789abcdef}
      COOKIE_SECURE: "false"  # true khi chạy sau HTTPS
      DB_POOL_MAX: 10
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://htm_app:htm_app_dev@postgres:5432/htm
      JWT_SECRET: ${JWT_SECRET:-local-only-secret-change-me-0123456789abcdef}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
